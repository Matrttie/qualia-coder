<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qualia Coder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: scholarly three-pane workspace (sources · text · codebook). Quiet neutral chrome on a 4px grid, one teal accent; the code colours in the transcript are the only rich colour. Serif for titles, mono for counts. */
:root{
  --paper:#f6f6f4; --panel:#ffffff; --panel-2:#f1f1ee; --ink:#1c1d1f; --ink-soft:#63666b;
  --line:#e5e5e1; --line-strong:#cfcfca; --accent:#117a74; --accent-soft:#e1efed;
  --danger:#b4453a; --warn:#a8741a; --good:#2f7d46; --shadow:0 1px 2px rgba(20,21,23,.05),0 4px 14px rgba(20,21,23,.07);
  --r:12px; --r-sm:8px;
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --display:"Source Serif 4",Georgia,"PingFang TC","Microsoft JhengHei",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141517; --panel:#1b1c1f; --panel-2:#232428; --ink:#e8e8e6; --ink-soft:#a2a5aa;
  --line:#2c2e32; --line-strong:#3c3f44; --accent:#4bc4ba; --accent-soft:#16302e;
  --danger:#e07a6f; --warn:#d9ab54; --good:#6cc487; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#141517; --panel:#1b1c1f; --panel-2:#232428; --ink:#e8e8e6; --ink-soft:#a2a5aa;
  --line:#2c2e32; --line-strong:#3c3f44; --accent:#4bc4ba; --accent-soft:#16302e;
  --danger:#e07a6f; --warn:#d9ab54; --good:#6cc487; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
::selection{background:var(--accent-soft)}

.topbar{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;min-height:56px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font);font-weight:600;font-size:15px;line-height:1.15}
.brand .glyph{width:24px;height:24px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px;flex:none}
.brand small{font-family:var(--font);font-weight:400;color:var(--ink-soft);font-size:11px}
.proj-name{background:transparent;border:1px solid transparent;border-radius:var(--r-sm);padding:4px 8px;font-weight:500;max-width:220px;min-width:0;transition:border-color .15s,background-color .15s}
.proj-name:hover{border-color:var(--line)} .proj-name:focus{outline:none;border-color:var(--accent);background:var(--panel-2)}
.tabs{display:flex;gap:2px;background:var(--panel-2);padding:3px;border-radius:10px}
.tab{border:none;background:transparent;padding:6px 16px;border-radius:7px;font-weight:500;color:var(--ink-soft);transition:color .15s,background-color .15s}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(20,21,23,.08)}
.tab:hover{color:var(--ink)}
.spacer{flex:1 1 auto}
.status{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:16px;
  padding:4px 12px 4px 10px;font-size:12px;font-weight:500;color:var(--ink-soft);white-space:nowrap;transition:border-color .15s}
.status:hover{border-color:var(--accent)}
.status .led{width:8px;height:8px;border-radius:50%;background:var(--line-strong);flex:none}
.status[data-s="live"] .led{background:var(--good)}
.status[data-s="connecting"] .led,.status[data-s="local"] .led{background:var(--warn)}
.status[data-s="offline"] .led,.status[data-s="locked"] .led{background:var(--danger)}
.people{display:flex;align-items:center;border:none;background:transparent;padding:0}
.ini{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-size:11px;font-weight:600;
  border:2px solid var(--panel);margin-left:-6px;flex:none;letter-spacing:0}
.people .ini:first-child{margin-left:0}
.people .more{font-size:11px;font-weight:500;color:var(--ink-soft);margin-left:4px}
.ini.sm{width:18px;height:18px;font-size:9px;border:none;margin:0}
.menu{position:relative}
.btn{border:1px solid var(--line-strong);background:var(--panel);border-radius:var(--r-sm);padding:6px 12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:color .15s,border-color .15s,background-color .15s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.btn.primary:hover{filter:brightness(1.07);color:var(--panel)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-soft)}
.btn.ghost:hover{background:var(--panel-2);color:var(--ink)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--panel)}
.btn.danger:hover{filter:brightness(1.07);color:var(--panel)}
.dropdown{position:absolute;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);box-shadow:var(--shadow);min-width:252px;padding:4px;z-index:40}
.dropdown button{display:flex;width:100%;align-items:center;gap:8px;border:none;background:transparent;padding:8px 12px;border-radius:var(--r-sm);text-align:left}
.dropdown button:hover{background:var(--panel-2)}
.dropdown button.del{color:var(--danger)}
.dropdown hr{border:none;border-top:1px solid var(--line);margin:4px 0}
.dropdown .k{margin-left:auto;color:var(--ink-soft);font-size:11px}

main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
section.view{flex:1 1 auto;min-height:0}

.workspace{display:grid;grid-template-columns:240px minmax(0,1fr) var(--cbw,360px);height:100%;min-height:0}
.col{min-height:0;min-width:0;display:flex;flex-direction:column;background:var(--panel)}
.col.docs{border-right:1px solid var(--line)}
.col.codes{border-left:1px solid var(--line);position:relative}
/* drag the codebook's left edge to resize it; double-click resets */
.cb-resize{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:5}
.cb-resize::after{content:"";position:absolute;left:3px;top:0;bottom:0;width:2px;background:transparent;transition:background-color .15s}
.cb-resize:hover::after,body.resizing .cb-resize::after{background:var(--accent)}
body.resizing{cursor:col-resize;user-select:none}
/* hover card with a code's full text */
#codeCard{position:fixed;z-index:70;width:340px;max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 16px;font-size:13px;line-height:1.6;pointer-events:none}
#codeCard .cc-name{display:flex;gap:8px;align-items:flex-start;font-weight:600;font-size:14px;line-height:1.45;margin-bottom:4px}
#codeCard .cc-name .swatch{margin-top:4px}
#codeCard .cc-meta{font-size:12px;color:var(--ink-soft);margin-bottom:8px}
#codeCard .cc-sec{margin-top:8px}
#codeCard .cc-sec b{display:block;font-size:11.5px;font-weight:500;color:var(--ink-soft)}
#codeCard .cc-sec div{white-space:pre-wrap}
.col-head{display:flex;align-items:center;gap:8px;padding:0 16px;min-height:48px;border-bottom:1px solid var(--line);flex:none}
.col-head h3{font-size:13px;color:var(--ink);font-family:var(--font);font-weight:600}
.col-head .count{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.col-body{flex:1 1 auto;overflow:auto;padding:8px}
.col-foot{flex:none;padding:8px;border-top:1px solid var(--line)}

.doc-item{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 12px;border-radius:var(--r-sm);cursor:pointer;margin-bottom:2px;transition:background-color .15s}
.doc-item:hover{background:var(--panel-2)}
.doc-item.active{background:var(--accent-soft)}
.doc-item .nm{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-item .qn{font-family:var(--mono);font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.doc-item.active .qn{color:var(--accent)}
.doc-item .x{opacity:0;border:none;background:transparent;color:var(--ink-soft);padding:2px 4px;border-radius:4px;flex:none}
.doc-item .dn{width:16px;height:16px;flex:none;border:1px solid var(--line-strong);border-radius:4px;background:transparent;padding:0;display:grid;place-items:center;font-size:10px;line-height:1;color:transparent;transition:border-color .15s,background-color .15s,color .15s}
.doc-item .dn:hover{border-color:var(--accent);color:var(--accent)}
.doc-item.done .dn{background:var(--accent);border-color:var(--accent);color:#fff}
.doc-item.done .nm{color:var(--ink-soft);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.doc-item:hover .x,.doc-item .x:focus-visible{opacity:1} .doc-item .x:hover{color:var(--danger);background:var(--panel)}

.viewer-wrap{background:var(--paper)}
.viewer-head{padding:0 24px;min-height:48px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex:none;background:var(--panel);flex-wrap:wrap}
.viewer-head .doc-title{font-family:var(--display);font-weight:600;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer-head .hint{margin-left:auto;font-size:12px;color:var(--ink-soft)}
.coder-sel{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);font-weight:500}
.coder-sel select{border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:4px 8px;font-weight:500;font-size:12.5px;color:var(--ink)}
.coder-sel select:disabled{color:var(--ink-soft);background:var(--panel-2)}
.viewer-scroll{flex:1 1 auto;overflow:auto;padding:40px 24px 64px}
#viewer{max-width:66ch;margin:0 auto;white-space:pre-wrap;overflow-wrap:break-word;font-size:16px;line-height:1.85;color:var(--ink)}
#viewer mark.hl{background:color-mix(in srgb,var(--c) 26%,transparent);color:inherit;border-radius:3px;
  padding:.5px 0;cursor:pointer;box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--c) 85%,transparent)}
#viewer mark.hl:hover{background:color-mix(in srgb,var(--c) 42%,transparent)}
/* passages coded by 2+ different people (Everyone view): hatched + dashed outline */
#viewer mark.hl.shared{background-image:repeating-linear-gradient(-45deg,transparent 0 5px,color-mix(in srgb,var(--ink) 16%,transparent) 5px 7px);outline:1.5px dashed var(--ink);outline-offset:1px}
#viewer mark.hl.flash{animation:ovflash 1.2s ease-out}
@keyframes ovflash{0%,40%{outline:3px solid var(--accent);outline-offset:3px}}
.ov-chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 12px;font-size:12px;font-weight:500;color:var(--ink);display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;transition:color .15s,border-color .15s}
.ov-chip:hover{border-color:var(--accent);color:var(--accent)}
.ov-chip .ov-key{width:14px;height:11px;border-radius:2px;outline:1.5px dashed currentColor;outline-offset:-1.5px;background-image:repeating-linear-gradient(-45deg,transparent 0 3px,color-mix(in srgb,currentColor 35%,transparent) 3px 4px)}
#viewer mark.hl.multi{box-shadow:inset 0 -2px 0 var(--c),inset 0 -5px 0 color-mix(in srgb,var(--c) 35%,transparent)}
.empty{max-width:44ch;margin:10vh auto 0;text-align:center;color:var(--ink-soft);white-space:normal}
.empty h2{font-size:20px;font-weight:600;color:var(--ink);margin-bottom:8px}
.empty p{margin:0 0 20px}
.empty .acts{display:flex;flex-direction:column;gap:8px;align-items:center}

.scope{display:flex;gap:2px;background:var(--panel-2);padding:2px;border-radius:8px}
.scope button{border:none;background:transparent;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:500;color:var(--ink-soft);transition:color .15s,background-color .15s}
.scope button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(20,21,23,.08)}
.scope select{border:none;background:transparent;padding:2px 4px;border-radius:6px;font-size:12px;font-weight:500;color:var(--ink-soft);max-width:92px;cursor:pointer}
.scope select.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(20,21,23,.08)}
.mine-note{font-size:12px;line-height:1.5;color:var(--ink-soft);background:var(--panel-2);border-radius:var(--r-sm);padding:8px 12px;margin-bottom:8px}
.code-search{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:8px 12px;margin-bottom:8px;transition:border-color .15s}
.code-search:focus{outline:none;border-color:var(--accent)}
.code-item{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 8px 0 12px;border-radius:var(--r-sm);cursor:pointer;margin-bottom:2px;transition:background-color .15s}
.code-item:hover{background:var(--panel-2)}
.code-item.filtered{background:var(--accent-soft)}
.swatch{width:12px;height:12px;border-radius:3px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);display:inline-block}
.code-item .nm{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code-item .cnt{font-family:var(--mono);font-size:12px;color:var(--ink-soft);min-width:20px;text-align:right;font-variant-numeric:tabular-nums}
.code-item .clr{border:none;background:transparent;color:var(--ink-soft);padding:0 4px;border-radius:4px;font-size:12px}
.code-item .clr:hover{color:var(--danger);background:var(--panel)}
.code-item.filtered .cnt{color:var(--accent);min-width:34px}
.code-item .edit{opacity:0;border:none;background:transparent;color:var(--ink-soft);padding:2px 4px;border-radius:4px}
.code-item:hover .edit,.code-item .edit:focus-visible{opacity:1} .code-item .edit:hover{color:var(--accent)}
.cid{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);margin-right:6px;font-weight:400}
.btag{font-size:11px;color:var(--ink-soft);border:1px solid var(--line);border-radius:4px;padding:0 6px;line-height:18px;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.foot-row{display:flex;gap:8px;position:relative}
.foot-row .btn{flex:1}
.dropdown.up{top:auto;bottom:calc(100% + 4px);left:8px;right:8px;min-width:0}
.frow{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px}
.frow.even{grid-template-columns:1fr 1fr}
.field textarea.sm{min-height:56px}
.imp-sum{background:var(--panel-2);border-radius:var(--r-sm);padding:12px 16px;margin-bottom:16px;font-size:13px;line-height:1.6}
.imp-sum b{font-weight:600}
.grp-label{font-size:12px;color:var(--ink-soft);font-weight:500;padding:16px 12px 4px}

#codePopup{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);width:272px;padding:12px}
#codePopup .ph{font-size:12px;color:var(--ink);font-weight:600;margin:0 0 8px;display:flex;align-items:center;gap:8px}
#codePopup .pquote{font-size:12px;line-height:1.5;color:var(--ink-soft);margin:0 0 8px;max-height:40px;overflow:hidden;border-left:2px solid var(--line-strong);padding-left:8px}
#codePopup .plist{max-height:192px;overflow:auto;margin:0 -4px}
#codePopup .pcode{display:flex;align-items:center;gap:10px;min-height:32px;padding:0 8px;border-radius:var(--r-sm);cursor:pointer;transition:background-color .15s}
#codePopup .pcode:hover{background:var(--panel-2)}
#codePopup .pcode.on{background:var(--accent-soft)}
#codePopup .pcode .ck{margin-left:auto;color:var(--accent);font-weight:600;opacity:0}
#codePopup .pcode.on .ck{opacity:1}
#codePopup .pquery{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:6px 10px;margin:0 0 8px;transition:border-color .15s}
#codePopup .pquery:focus{outline:none;border-color:var(--accent)}
#codePopup .pcode.kb{background:var(--panel-2);box-shadow:inset 0 0 0 1px var(--line-strong)}
#codePopup .pcode.on.kb{background:var(--accent-soft)}
#codePopup .pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
#codePopup .pnew{color:var(--accent)}
#codePopup .pplus{width:12px;text-align:center;font-weight:600;flex:none}
#codePopup .phint{font-size:11px;color:var(--ink-soft);margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}

.overlay{position:fixed;inset:0;background:rgba(15,17,20,.4);z-index:60;display:grid;place-items:center;padding:20px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);width:min(500px,100%);max-height:86vh;overflow:auto;padding:24px}
.modal h2{font-size:20px;font-weight:600;margin-bottom:4px}
.modal .sub{color:var(--ink-soft);font-size:13px;margin-bottom:16px}
.modal ul{margin:0 0 6px;padding-left:18px;line-height:1.6}
.modal li{margin-bottom:6px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--ink-soft);margin-bottom:4px}
.field input[type=text],.field input[type=password],.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:8px 12px}
.field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent)}
.field textarea{min-height:90px;resize:vertical;line-height:1.55}
.field textarea[readonly]{opacity:.8}
.palette{display:flex;flex-wrap:wrap;gap:8px}
.palette .p{width:28px;height:28px;border-radius:6px;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);border:none}
.palette .p.on{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}
.modal-actions .left{margin-right:auto}

.q-codes{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 2px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel-2);border-radius:6px;padding:4px 10px;font-weight:500;font-size:12.5px}
.chip.rmable{padding-right:6px}
.chip .dot{width:10px;height:10px;border-radius:3px}
.chip .rm{border:none;background:transparent;color:var(--ink-soft);padding:2px 4px;border-radius:4px;line-height:1}
.chip .rm:hover{color:var(--danger);background:var(--panel)}
.who{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.byline{font-size:12px;color:var(--ink-soft);margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.blockquote{border-left:2px solid var(--accent);background:var(--paper);padding:12px 16px;border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:15px;line-height:1.7;margin:4px 0 16px;max-height:160px;overflow:auto;white-space:pre-wrap}
.copybox{width:100%;min-height:220px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);background:var(--paper);border-radius:var(--r-sm);padding:12px}

.pad-scroll{height:100%;overflow:auto;padding:40px 24px 64px}
.wrap{max-width:1000px;margin:0 auto}
.view-title{font-size:28px;font-weight:600;margin-bottom:4px}
.view-sub{color:var(--ink-soft);margin:0 0 24px;font-size:14px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:24px;overflow:hidden}
.stat{padding:16px 20px;border-left:1px solid var(--line);margin-left:-1px}
.stat .n{font-family:var(--display);font-size:32px;font-weight:500;line-height:1.1;font-variant-numeric:tabular-nums lining-nums}
.stat .l{font-size:12px;color:var(--ink-soft);margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px;margin-bottom:16px;min-width:0}

<script>
"use strict";
/* ================= constants & state ================= */
const PALETTE=["#117a74","#2f6fb3","#9b4bbf","#c0563f","#d39712","#3f8f4e","#b5417e","#5a6b8c","#7a7320","#348a98","#8a5a2b","#6b5bd6"];
const KEY="qualia_coder_v1";                         // offline (this-browser) project
const ME_KEY=window.QUALIA_ID_KEY||"qualia_coder_me"; // who I am on this device
const PASS_KEY="qualia_coder_pass";
const CHUNK=20000;                                   // chars per stored text piece (a Sheets cell holds 50,000)
const IN_GAS=!!(window.google&&google.script&&google.script.run);
const API_URL=String(window.QUALIA_API_URL||"").trim();      // set on the GitHub Pages copy
const SHARED=IN_GAS||!!API_URL;
const $=id=>document.getElementById(id);

let state=emptyProject();
let ui={view:"code",currentDoc:null,codeFilter:null,codeIdx:-1,search:"",memoId:null,coder:"all",mine:lsGet(KEY+"_mine")==="1",dragging:false,renderAfterDrag:false,modalLocked:false};
let mode="connecting";   // connecting | shared | local
let status="connecting"; // connecting | live | offline | locked | local
const readOnly=false;
let me={id:null,name:""};
let people={};           // coderId -> {name}

function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
// true while an input method (Chinese/Japanese/Korean IME) is still composing; Enter/Escape then belong to the IME
function imeBusy(e){return e.isComposing||e.keyCode===229}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function codeById(id){return state.codes.find(c=>c.id===id)}
function docById(id){return state.documents.find(d=>d.id===id)}
function myBy(){return mode==="shared"?me.id:null}
function qText(q){const d=docById(q.docId);return d&&d.content&&q.end<=d.content.length?d.content.slice(q.start,q.end):(q.text||"")}
// "Mine only" lens: hides teammates' codings and codes so you can code without being influenced (shared projects only)
function mineOnly(){return mode==="shared"&&ui.mine&&!!me.id}
function setMineOnly(on){ui.mine=!!on;lsSet(KEY+"_mine",ui.mine?"1":"0");renderAll();}
// codes a person created or applied
function codeIdsOf(u){const s=new Set(state.codes.filter(c=>c.by&&c.by===u).map(c=>c.id));state.quotations.forEach(q=>{if(q.by===u)q.codeIds.forEach(id=>s.add(id));});return s}
function myCodeIds(){return codeIdsOf(me.id)}
// whose codes the codebook lists: the Mine lens, else the person picked in the codebook or the viewer's Coder menu
function scopePerson(){return mineOnly()?me.id:(mode==="shared"&&ui.coder!=="all"?ui.coder:null)}
function visibleCodes(){const u=scopePerson();if(!u)return state.codes;const ids=codeIdsOf(u);return state.codes.filter(c=>ids.has(c.id))}
function visibleQuotes(){if(mineOnly())return state.quotations.filter(q=>q.by===me.id);return ui.coder==="all"?state.quotations:state.quotations.filter(q=>q.by===ui.coder)}
function quotesOfDoc(id){return visibleQuotes().filter(q=>q.docId===id)}
function canModifyQ(q){return mode!=="shared"||!q.by||q.by===me.id}
function canDeleteQ(q){return canModifyQ(q)}
function canDeleteDoc(d){return mode!=="shared"||!d.by||d.by===me.id}
function emptyProject(){return{name:"Untitled project",documents:[],codes:[],quotations:[],memos:[]}}
function requireName(){if(mode==="shared"&&!me.name){askName(true);return false;}return true;}

/* ================= people ================= */
function personName(id){if(!id)return"Unattributed";if(id===me.id)return"You";const p=people[id];return p&&p.name?p.name:"Someone"}
function rawName(id){if(id===me.id)return me.name||"You";const p=people[id];return p&&p.name?p.name:"Someone"}
function personColor(id){let h=0;for(const ch of String(id))h=(h*31+ch.charCodeAt(0))>>>0;return PALETTE[h%PALETTE.length]}
function initials(id){const n=rawName(id).trim();const w=n.split(/\s+/).filter(Boolean);
  const s=(w.length>1?w[0][0]+w[1][0]:[...n].slice(0,/^[\x00-\x7f]/.test(n)?2:1).join(""));return (s||"?").toUpperCase()}
function avatarHTML(id,extra){return `<span class="ini${extra?" "+extra:""}" style="background:${personColor(id)}" title="${esc(rawName(id))}">${esc(initials(id))}</span>`}
function whoHTML(id){return id?`<span class="who">${avatarHTML(id,"sm")}${esc(personName(id))}</span>`:`<span class="who">Unattributed</span>`}
function coderIds(){return [...new Set(state.quotations.map(q=>q.by).filter(Boolean))]}
function contributorIds(){return [...new Set([...state.quotations,...state.documents,...state.memos,...state.codes].map(x=>x.by).filter(Boolean))]}
function loadMe(){const r=lsGet(ME_KEY);if(r){try{const o=JSON.parse(r);if(o&&o.id)me={id:o.id,name:o.name||""};}catch(e){}}}
function askName(first){
  openModal(`<h2>${first?"Who's coding?":"Change your name"}</h2>
    <p class="sub">${first?"Your name is shown next to every passage you code, so the team can compare coders. It's remembered on this device.":"Your codings keep their link to you; only the displayed name changes."}</p>
    <div class="field"><label for="n_name">Your name</label><input type="text" id="n_name" maxlength="60" value="${esc(me.name)}" placeholder="e.g. Mei-Ling"></div>
    <div class="modal-actions">${first?"":'<button class="btn" data-close>Cancel</button>'}<button class="btn primary" id="n_save">${first?"Start coding":"Save"}</button></div>`,{locked:first});
  const go=()=>{const v=$("n_name").value.trim();if(!v){toast("Enter your name to continue");return;}
    // same person on a new device or browser: typing an existing name continues as that coder
    const existing=first?Object.keys(people).find(id=>id!==me.id&&(people[id].name||"").trim().toLowerCase()===v.toLowerCase()):null;
    if(existing){me.id=existing;me.name=people[existing].name;lsSet(ME_KEY,JSON.stringify(me));closeModal(true);renderAll();toast("Welcome back, "+me.name);return;}
    if(!me.id)me.id=uid("u");me.name=v;lsSet(ME_KEY,JSON.stringify(me));
    people[me.id]={...(people[me.id]||{done:[]}),name:v};queueWrite("people/"+me.id,{name:v,done:myDone(),at:Date.now()});
    closeModal(true);renderAll();toast("Coding as "+v);};
  $("n_save").onclick=go;$("n_name").addEventListener("keydown",e=>{if(e.key==="Enter"&&!imeBusy(e))go();});
}

/* ================= sample project ================= */
function sampleProject(){
  const txt=`Interviewer: Thanks for joining. To start, how has moving to remote work changed your daily routine?

Participant: Honestly it rewired everything. I used to anchor my day around the commute — now the boundary between work and home just dissolves. Some mornings I open my laptop before I've even had coffee, and some evenings I realise it's eight o'clock and I never really stopped.

Interviewer: Does that flexibility feel like a gain or a loss?

Participant: Both, and that's the hard part. I love not losing two hours to the train. I can start a load of laundry between meetings, pick up my kid from school. But the flip side is that I feel like I'm always half-available. There's a quiet pressure to respond to messages instantly, because being offline looks like being absent.

Interviewer: How does your team stay connected?

Participant: We over-communicate on purpose. Lots of short video calls, a very active chat channel. It mostly works, but I miss the unplanned stuff — the corridor conversation where a problem gets solved in thirty seconds. Now everything needs a calendar invite. Collaboration became more deliberate but also more exhausting.

Interviewer: What would make remote work sustainable for you long term?

Participant: Clearer norms, really. If the company actually protected focus time and said it's fine to be offline after six, I think I'd thrive. The technology isn't the problem. It's the unspoken expectations around it.`;
  const by=myBy(),now=Date.now();
  const d={id:uid("d"),name:"Interview 01 — Remote work (example)",content:txt,example:true,by,at:now};
  const mk=(n,c,g,m,i)=>({id:uid("c"),name:n,color:c,group:g,memo:m||"",by,at:now+i});
  const c1=mk("Work-life boundary",PALETTE[0],"Experience","The dissolving line between work and home.",0);
  const c2=mk("Flexibility",PALETTE[3],"Experience","",1);
  const c3=mk("Always-on pressure",PALETTE[2],"Tension","Felt expectation of constant availability.",2);
  const c4=mk("Team communication",PALETTE[1],"Practice","",3);
  const c5=mk("Organisational norms",PALETTE[4],"Solution","",4);
  const quotes=[];
  const addQ=(phrase,codeIds,comment)=>{const i=txt.indexOf(phrase);if(i<0)return;quotes.push({id:uid("q"),docId:d.id,start:i,end:i+phrase.length,text:phrase,codeIds,comment:comment||"",by,at:now});};
  addQ("the boundary between work and home just dissolves",[c1.id],"Core metaphor: dissolving boundary.");
  addQ("some evenings I realise it's eight o'clock and I never really stopped",[c1.id,c3.id]);
  addQ("I love not losing two hours to the train",[c2.id]);
  addQ("I can start a load of laundry between meetings, pick up my kid from school",[c2.id]);
  addQ("a quiet pressure to respond to messages instantly, because being offline looks like being absent",[c3.id],"Availability as visibility.");
  addQ("We over-communicate on purpose",[c4.id]);
  addQ("I miss the unplanned stuff",[c4.id],"Loss of informal collaboration.");
  addQ("Collaboration became more deliberate but also more exhausting",[c4.id]);
  addQ("If the company actually protected focus time and said it's fine to be offline after six",[c5.id,c3.id]);
  addQ("It's the unspoken expectations around it",[c5.id],"Problem framed as norms, not tech.");
  return {name:"Example — Remote work study",documents:[d],codes:[c1,c2,c3,c4,c5],quotations:quotes,
    memos:[{id:uid("m"),title:"Research question (example)",content:"RQ: How do remote workers experience the renegotiation of work-life boundaries?\n\nEarly hunch: the boundary problem is less about technology and more about unspoken availability norms.",by,at:now,updated:now}]};
}

/* ================= offline (this browser) storage ================= */
function saveLocal(){if(mode!=="local")return;lsSet(KEY,JSON.stringify(state))}
function loadLocal(){const r=lsGet(KEY);if(r){try{const s=JSON.parse(r);if(s&&Array.isArray(s.documents))return s;}catch(e){}}return null}
function localMigratable(){const s=loadLocal();return !!(s&&s.documents.some(d=>!d.example))}

/* ================= unified write layer ================= */
function upsertLocal(kind,obj){const a=state[kind];const i=a.findIndex(x=>x.id===obj.id);if(i>=0)a[i]=obj;else a.push(obj);}
function put(kind,obj){
  upsertLocal(kind,obj);
  if(mode==="shared"){if(kind==="documents")writeDocumentShared(obj);else queueWrite(kind+"/"+obj.id,bodyOf(obj));}
  else saveLocal();
  scheduleRender();
}
function del(kind,id){
  const old=state[kind].find(x=>x.id===id);
  state[kind]=state[kind].filter(x=>x.id!==id);
  if(mode==="shared"){
    queueWrite(kind+"/"+id,null);
    if(kind==="documents"){const r=raw.documents[id];const n=r&&r.chunks?r.chunks:Math.max(1,Math.ceil(((old&&old.content)||"").length/CHUNK));for(let i=0;i<n;i++)queueWrite("doctext/"+id+"-"+i,null);}
  }else saveLocal();
  scheduleRender();
}
function bodyOf(o){const c={...o};delete c.id;delete c.content;if(c.text&&c.text.length>5000)c.text=c.text.slice(0,5000);return JSON.parse(JSON.stringify(c));}
function joinText(id){return Object.values(raw.doctext).filter(t=>t.docId===id).sort((a,b)=>a.i-b.i).map(t=>t.text).join("")}
function writeDocumentShared(d){
  const text=d.content||"";const n=Math.max(1,Math.ceil(text.length/CHUNK));
  const r=raw.documents[d.id];const oldN=r&&r.chunks?r.chunks:0;
  if(!r||joinText(d.id)!==text){
    for(let i=0;i<n;i++)queueWrite("doctext/"+d.id+"-"+i,{docId:d.id,i,text:text.slice(i*CHUNK,(i+1)*CHUNK)});
    for(let i=n;i<oldN;i++)queueWrite("doctext/"+d.id+"-"+i,null);
  }
  queueWrite("documents/"+d.id,{name:d.name,chunks:n,by:d.by||null,at:d.at||Date.now(),example:!!d.example});
}
function setProjectName(n){state.name=n;if(mode==="shared")queueWrite("meta/project",{name:n});else saveLocal();}

/* ================= sync with the Google Sheet ================= */
const DEL={};const pendingW=new Map();
const raw={meta:{},documents:{},doctext:{},codes:{},quotations:{},memos:{},people:{}};
let since=0,syncing=false,syncTimer=null,firstSynced=false,fails=0,syncAgain=false;
function queueWrite(path,body){pendingW.set(path,body===null?DEL:body);if(mode==="shared")scheduleSync(400);}
function scheduleSync(ms){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,ms);}
function gs(fn,arg){
  if(API_URL)   // text/plain keeps this a "simple" request (no CORS preflight); no cookies, so Google account sign-ins never matter
    return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn,arg}),credentials:"omit",redirect:"follow",cache:"no-store"})
      .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.text();})
      .then(t=>{try{return JSON.parse(t);}catch(e){throw new Error("Not JSON (is the Apps Script updated with doPost?)");}});
  return new Promise((res,rej)=>{google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](arg);});}
function applyRaw(path,body){const i=path.indexOf("/");const c=path.slice(0,i),id=path.slice(i+1);if(!raw[c])return;if(body==null)delete raw[c][id];else raw[c][id]=body;}
async function syncNow(){
  if(mode!=="shared")return;
  if(syncing){syncAgain=true;return;}
  syncing=true;clearTimeout(syncTimer);
  const batch=[...pendingW.entries()].slice(0,40);
  let next=document.hidden?20000:4000;
  try{
    const r=await gs("api",{passcode:lsGet(PASS_KEY)||"",since,writes:batch.map(([p,b])=>({path:p,body:b===DEL?null:b}))});
    if(r&&r.error==="bad_passcode"){setStatus("locked");syncing=false;askPasscode();return;}
    if(!r||r.error){throw new Error((r&&r.error)||"no response");}
    batch.forEach(([p,b])=>{if(pendingW.get(p)===b)pendingW.delete(p);});
    (r.changes||[]).forEach(c=>applyRaw(c.path,c.body));
    (r.rejected||[]).forEach(x=>toast(x.reason==="too_large"?"One item was too large to save and was skipped":"A change couldn't be saved ("+x.reason+")"));
    since=r.serverTime||since;fails=0;
    const wasFirst=!firstSynced;firstSynced=true;setStatus("live");
    if(wasFirst||batch.length||(r.changes&&r.changes.length))rebuild();   // redraw only when something changed
    if(wasFirst&&!me.name&&!ui.modalLocked)askName(true);
    if(pendingW.size)next=250;
  }catch(e){fails++;setStatus("offline");next=Math.min(30000,2000*fails);}
  syncing=false;
  if(syncAgain){syncAgain=false;next=Math.min(next,250);}
  scheduleSync(next);
}

function rebuild(){
  const v={};for(const k in raw)v[k]={...raw[k]};
  pendingW.forEach((b,p)=>{const i=p.indexOf("/");const c=p.slice(0,i),id=p.slice(i+1);if(!v[c])return;if(b===DEL)delete v[c][id];else v[c][id]=b;});
  people={};Object.entries(v.people).forEach(([id,p])=>{people[id]={name:(p&&p.name)||"",done:Array.isArray(p&&p.done)?p.done:[]};});
  if(me.id&&me.name)people[me.id]={...(people[me.id]||{done:[]}),name:me.name};
  const prev=new Map(state.documents.map(d=>[d.id,d]));
  const texts={};Object.values(v.doctext).forEach(t=>{if(t&&t.docId)(texts[t.docId]=texts[t.docId]||[]).push(t);});
  state.documents=Object.entries(v.documents).map(([id,d])=>{
    let content=(texts[id]||[]).sort((a,b)=>a.i-b.i).map(p=>p.text||"").join("");
    const p=prev.get(id);if(!content&&p&&p.content)content=p.content;
    return{id,name:d.name||"Untitled document",content,by:d.by||null,at:d.at||0,example:!!d.example};
  }).sort((a,b)=>a.at-b.at);
  state.codes=Object.entries(v.codes).map(([id,c])=>({id,name:c.name||"Untitled code",color:c.color||PALETTE[0],group:c.group||"",memo:c.memo||"",
    code:c.code||"",include:c.include||"",exclude:c.exclude||"",theme:c.theme||"",source:c.source||"",book:c.book||"",by:c.by||null,at:c.at||0})).sort((a,b)=>a.at-b.at);
  state.quotations=Object.entries(v.quotations).filter(([,q])=>q&&q.docId).map(([id,q])=>({id,docId:q.docId,start:q.start|0,end:q.end|0,text:q.text||"",codeIds:Array.isArray(q.codeIds)?q.codeIds.slice():[],comment:q.comment||"",by:q.by||null,at:q.at||0}));
  state.memos=Object.entries(v.memos).map(([id,m])=>({id,title:m.title||"",content:m.content||"",by:m.by||null,at:m.at||0,updated:m.updated||0})).sort((a,b)=>b.at-a.at);
  if(memoDraft){const m=state.memos.find(x=>x.id===memoDraft.id);if(m){m.title=memoDraft.title;m.content=memoDraft.content;}}

}

function charOffset(root,node,offset){
  if(node===root){let t=0;for(let i=0;i<offset;i++)t+=(root.childNodes[i].textContent||"").length;return t;}
  if(node.nodeType!==3){let t=0;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const stop=node.childNodes[offset]||null;
    while((n=w.nextNode())){if(stop&&(stop===n||stop.contains(n)))return t;if(!stop&&!node.contains(n)&&(node.compareDocumentPosition(n)&Node.DOCUMENT_POSITION_FOLLOWING))return t;t+=n.nodeValue.length;}return t;}
  let total=0;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;
  while((n=w.nextNode())){if(n===node)return total+offset;total+=n.nodeValue.length;}return total;
}
function handleSelection(){
  const sel=window.getSelection();if(!sel||sel.isCollapsed||!sel.rangeCount)return;
  const r=sel.getRangeAt(0);if(!viewerEl.contains(r.commonAncestorContainer))return;
  const d=docById(ui.currentDoc);if(!d)return;
  if(!requireName())return;
  let start=charOffset(viewerEl,r.startContainer,r.startOffset),end=charOffset(viewerEl,r.endContainer,r.endOffset);
  if(start>end)[start,end]=[end,start];
  while(start<end&&/\s/.test(d.content[start]))start++;
  while(end>start&&/\s/.test(d.content[end-1]))end--;
  if(end-start<1)return;
  pendingSel={docId:d.id,start,end,text:d.content.slice(start,end),qid:null};openCodePopup();
}

/* ================= code popup ================= */
function pendingQuote(){return pendingSel&&pendingSel.qid?state.quotations.find(q=>q.id===pendingSel.qid):null}
function openCodePopup(){
  const pop=$("codePopup");
  const mine=mineOnly()?myCodeIds():null;
  const applied=()=>(pendingQuote()||{codeIds:[]}).codeIds;
  const pool=mine?state.codes.filter(c=>applied().includes(c.id)||mine.has(c.id)):state.codes;
  pop.innerHTML=`<div class="ph">Apply codes <button class="btn ghost sm" data-popclose style="margin-left:auto;padding:2px 8px">Done</button></div>
    <div class="pquote">${esc(pendingSel.text.slice(0,120))}${pendingSel.text.length>120?"…":""}</div>
    <input id="codeQuery" class="pquery" maxlength="120" placeholder="Search or create a code" aria-label="Search or create a code" autocomplete="off">
    <div class="plist" id="plist"></div><div class="phint">↑↓ to choose · Enter to apply · ⌘Z to undo</div>`;
  pop.hidden=false;
  const inp=$("codeQuery"),listEl=$("plist");let kb=-1,rows=[];
  // search: name or group contains the query; names starting with it come first
  const rec=recentCodes().filter(id=>pool.some(c=>c.id===id)).slice(0,5);let nRecent=0;
  function matches(q){nRecent=0;
    if(!q){if(!rec.length)return pool;nRecent=rec.length;return [...rec.map(id=>pool.find(c=>c.id===id)),...pool.filter(c=>!rec.includes(c.id))];}
    const s=q.toLowerCase();
    const starts=c=>c.name.toLowerCase().startsWith(s)||(c.code||"").toLowerCase().startsWith(s);
    return pool.filter(c=>codeMatches(c,s)).sort((a,b)=>starts(b)-starts(a));}
  function draw(){
    const q=inp.value.trim(),list=matches(q),on=applied();
    const exact=q&&state.codes.some(c=>c.name.toLowerCase()===q.toLowerCase()||(c.code||"").toLowerCase()===q.toLowerCase());
    rows=list.map(c=>({type:"code",c}));if(q&&!exact)rows.push({type:"new",name:q});
    if(!rows.length){listEl.innerHTML=`<div class="muted" style="padding:8px;font-size:12.5px">${pool.length?"":"No codes yet. Type a name to create one."}</div>`;kb=-1;return;}
    if(kb>=rows.length)kb=rows.length-1;if((q||nRecent)&&kb<0)kb=0;
    const label=i=>nRecent&&i===0?'<div class="plabel">Recent</div>':nRecent&&i===nRecent?'<div class="plabel">All codes</div>':"";
    listEl.innerHTML=rows.map((r,i)=>label(i)+(r.type==="code"
      ?`<div class="pcode${on.includes(r.c.id)?" on":""}${i===kb?" kb":""}" data-i="${i}" role="button" tabindex="-1"><span class="swatch" style="background:${r.c.color}"></span><span class="pname">${codeLabelHTML(r.c)}</span><span class="ck">✓</span></div>`
      :`<div class="pcode pnew${i===kb?" kb":""}" data-i="${i}" role="button" tabindex="-1"><span class="pplus">+</span><span class="pname">Create “${esc(r.name)}”</span></div>`)).join("");
    listEl.querySelectorAll(".pcode").forEach(el=>{el.onclick=()=>pick(+el.getAttribute("data-i"),false);const r=rows[+el.getAttribute("data-i")];if(r&&r.type==="code")attachCodeCard(el,r.c);});
    const k=listEl.querySelector(".kb");if(k)k.scrollIntoView({block:"nearest"});
  }
  // mouse click on an existing code toggles it and keeps the popup open (several codes per passage);
  // Enter applies the highlighted code, or creates the new one, and closes the popup
  function pick(i,viaKey){const r=rows[i];if(!r)return;
    const undo={label:"Undo",fn:undoLast};
    if(r.type==="new"){const c=createCode(r.name);toggleCodeOnPending(c.id,true);if(lastUndo)lastUndo.newCode=c.id;closeCodePopup();toast("Coded as “"+r.name+"”",undo);return;}
    if(viaKey){toggleCodeOnPending(r.c.id,true);closeCodePopup();toast("Coded as “"+r.c.name+"”",undo);return;}
    toggleCodeOnPending(r.c.id);draw();}
  draw();

// Reads the team's Markdown codebook (tables under "### group" headings, columns 代號 · 代碼名稱 · 定義 · 納入規則 ·
// 排除與邊界 · 主題 · 來源) or a CSV with the same columns. Tables without an ID, a name and a definition column are skipped.
const CB_COLS={code:["代號","代码","code id","codeid","id"],name:["代碼名稱","代码名称","名稱","名称","name","code name"],
  memo:["定義","定义","說明","说明","definition","description"],include:["納入規則","納入","纳入规则","include","include when","inclusion"],
  exclude:["排除與邊界","排除","排除与边界","exclude","exclude / boundary","exclusion","boundary"],theme:["主題","主题","theme"],
  source:["來源","来源","source","v1 來源","v1 来源"],group:["群組","群组","分組","group"],book:["codebook","碼本","码本"],color:["color","colour","顏色"]};
function cbHeaderMap(cells){const m={};const norm=cells.map(h=>h.replace(/[*`]/g,"").trim().toLowerCase());
  for(const k in CB_COLS){const i=norm.findIndex(h=>CB_COLS[k].includes(h));if(i>=0)m[k]=i;}return m;}
function cbClean(v){v=String(v==null?"":v).replace(/\*\*|`/g,"").replace(/<br\s*\/?>/gi,"\n").replace(/\\\|/g,"|").trim();return /^[—–-]$/.test(v)?"":v}
function cbRowFrom(cells,m,group){const g=k=>m[k]!=null?cbClean(cells[m[k]]):"";
  const r={code:g("code"),name:g("name"),memo:g("memo"),include:g("include"),exclude:g("exclude"),theme:g("theme"),source:g("source"),group:g("group")||group||"",book:g("book"),color:g("color")};
  return r.name?r:null;}
function parseCodebook(text){
  text=text.replace(/^﻿/,"");const lines=text.split(/\r?\n/);const out=[];
  if(lines.some(l=>/^\s*\|.*\|\s*$/.test(l))){            // Markdown tables
    let heading="",m=null;
    const cellsOf=l=>l.trim().replace(/^\|/,"").replace(/\|$/,"").split(/(?<!\\)\|/).map(x=>x.trim());
    for(let i=0;i<lines.length;i++){const l=lines[i];
      const h=l.match(/^#{1,6}\s+(.*)$/);if(h){heading=h[1].replace(/[*`]/g,"").replace(/[（(][^（()）]*[)）]\s*$/,"").trim();m=null;continue;}
      if(!/^\s*\|/.test(l)){m=null;continue;}
      const cells=cellsOf(l);
      if(cells.every(c=>/^:?-{2,}:?$/.test(c)))continue;
      if(!m){const hm=cbHeaderMap(cells);m=hm.name!=null&&hm.memo!=null?hm:{skip:true};continue;}
      if(m.skip)continue;const r=cbRowFrom(cells,m,heading);if(r)out.push(r);}
  }else{                                                   // CSV
    const rows=[];let row=[],cur="",q=false;
    for(let i=0;i<text.length;i++){const ch=text[i];
      if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=ch;}
      else if(ch==='"')q=true;else if(ch===","){row.push(cur);cur="";}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur="";}else cur+=ch;}
    if(cur||row.length){row.push(cur);rows.push(row);}
    const m=rows.length?cbHeaderMap(rows[0]):{};if(m.name==null)return [];
    rows.slice(1).forEach(r=>{const x=cbRowFrom(r,m,"");if(x)out.push(x);});
  }
  return out;
}
function importCodebookModal(rows,filename){
  if(!rows.length){toast("No codebook table found (needs 代號/代碼名稱/定義 columns)");return;}

    <div class="imp-sum">Found <b>${rows.length}</b> codes in <b>${groups.length||1}</b> group${groups.length===1?"":"s"}.<br><span id="i_plan"></span></div>
    <div class="field"><label for="i_book">Codebook name</label><input type="text" id="i_book" maxlength="60" list="ibooks" value="${esc(fileBooks.length?"":me.name||"")}" placeholder="${fileBooks.length?"Use the Codebook column in the file":"e.g. Battie"}">
      <datalist id="ibooks">${allBooks().map(b=>`<option value="${esc(b)}">`).join("")}</datalist></div>
    <p class="muted" style="font-size:12.5px;margin:0">Codes whose ID (or name, if there is no ID) already exists in the same codebook are updated; their colour and codings stay. Everything else is added.</p>
    <div class="modal-actions"><button class="btn" data-close>Cancel</button><button class="btn primary" id="i_go">Import</button></div>`);
  const plan=()=>{const inp=$("i_book").value.trim();let add=0,upd=0;
    rows.forEach(r=>{const bk=inp||r.book||me.name||"";if(findCbMatch(r,bk))upd++;else add++;});
    $("i_plan").textContent=`${add} new${upd?`, ${upd} updated`:""}.`;return{add,upd};};
  plan();$("i_book").addEventListener("input",plan);
  $("i_go").onclick=()=>{if(!requireName())return;const inp=$("i_book").value.trim();const now=Date.now();
    const gcol={};let gi=0;const used=new Set(state.codes.map(c=>c.color));
    const colorFor=g=>{if(!(g in gcol)){gcol[g]=PALETTE.find(p=>!used.has(p))||PALETTE[(gi)%PALETTE.length];used.add(gcol[g]);gi++;}return gcol[g];};
    let add=0,upd=0;
    rows.forEach((r,i)=>{const book=inp||r.book||me.name||"";const ex=findCbMatch(r,book);
      const f={name:r.name,code:r.code,memo:r.memo,include:r.include,exclude:r.exclude,theme:r.theme,source:r.source,group:r.group,book};
      if(ex){put("codes",{...ex,...f});upd++;}
      else{put("codes",{id:uid("c"),...f,color:/^#[0-9a-f]{6}$/i.test(r.color)?r.color:colorFor(r.group),by:myBy(),at:now+i});add++;}});
    closeModal();toast(`Imported ${add+upd} codes${inp?` into “${inp}”`:""}`);};
}
function findCbMatch(r,book){return state.codes.find(c=>bookOf(c)===book&&(r.code?c.code===r.code:!c.code&&c.name===r.name))}
function exportCodebookModal(){

    <div class="frow even"><div class="field"><label for="e_book">Codebook</label><select id="e_book"><option value="">All codes (${state.codes.length})</option>${books.map(b=>`<option value="${esc(b)}">${esc(b)} (${state.codes.filter(c=>bookOf(c)===b).length})</option>`).join("")}</select></div>
      <div class="field"><label for="e_fmt">Format</label><select id="e_fmt"><option value="md">Markdown (.md)</option><option value="csv">CSV (.csv, for Excel)</option></select></div></div>

function exportCodebook(book,fmt){
  const codes=state.codes.filter(c=>!book||bookOf(c)===book);
  const first={};codes.forEach(c=>{const g=c.group||"";if(!(g in first)||c.at<first[g])first[g]=c.at;});
  const groups=Object.keys(first).sort((a,b)=>a===""?1:b===""?-1:first[a]-first[b]);
  const segs=c=>state.quotations.filter(q=>q.codeIds.includes(c.id));
  const sorted=g=>codes.filter(c=>(c.group||"")===g).sort((a,b)=>a.code&&b.code?natCmp(a.code,b.code):a.code?-1:b.code?1:a.at-b.at);
  const title=(state.name||"Codebook")+(book?"｜"+book:"");const fname=safeName(title)+"_codebook";
  const head=["代號","代碼名稱","定義","納入規則","排除與邊界","主題","來源","段數","文件數","Codebook"];
  const vals=c=>{const q=segs(c);return [c.code,c.name,c.memo,c.include,c.exclude,c.theme,c.source,q.length,new Set(q.map(x=>x.docId)).size,bookOf(c)];};
  if(fmt==="csv"){const rows=[["群組",...head,"color"]];groups.forEach(g=>sorted(g).forEach(c=>rows.push([g,...vals(c),c.color])));
    downloadText("﻿"+rows.map(r=>r.map(v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`).join(",")).join("\r\n"),fname+".csv");return;}
  const cell=v=>String(v==null||v===""?"—":v).replace(/\|/g,"\\|").replace(/\r?\n/g,"<br>");
  const today=new Date().toISOString().slice(0,10);
  let md=`# ${title}｜碼本\n\n- 匯出日期：${today}\n- 代碼數：${codes.length}${book?"":`（${allBooks().length} 個 codebook）`}\n- 「段數」為所有編碼者套用此代碼的段落數；「文件數」為出現此代碼的文件數。\n`;
  groups.forEach(g=>{md+=`\n### ${g||"未分組"}\n\n| ${head.join(" | ")} |\n|${head.map(()=>"---").join("|")}|\n`;
    sorted(g).forEach(c=>{md+=`| ${vals(c).map(cell).join(" | ")} |\n`;});});

/* merge: move every coding of one code onto another, keep a note of it in the target's Source, then delete the old code */
function mergeCodeModal(id){
  const src=codeById(id);if(!src)return;

  const byBook=b=>others.filter(c=>bookOf(c)===b).sort((a,c)=>a.code&&c.code?natCmp(a.code,c.code):a.name.localeCompare(c.name));
  const label=c=>(c.code?c.code+" ":"")+c.name;
  openModal(`<h2>Merge “${esc(label(src))}”</h2><p class="sub">Every passage coded with it moves to the code you pick, then this code is removed. Use it when two codebooks have the same idea under different names.</p>
    <div class="field"><label for="m_to">Merge into</label><select id="m_to">${books.length>1?books.map(b=>`<optgroup label="${esc(b||"No codebook")}">${byBook(b).map(opt).join("")}</optgroup>`).join(""):byBook(books[0]).map(opt).join("")}</select></div>
    <div class="imp-sum" id="m_sum"></div>

  const uses=state.quotations.filter(q=>q.codeIds.includes(id));
  const sum=()=>{const to=$("m_to").value;const both=uses.filter(q=>q.codeIds.includes(to)).length;const others=mode==="shared"?uses.filter(q=>q.by&&q.by!==me.id).length:0;
    $("m_sum").innerHTML=`<b>${uses.length}</b> passage${uses.length===1?"":"s"} will move to “${esc(label(codeById(to)))}”${both?`, ${both} of them already have it`:""}.${others?` ${others} were coded by other people.`:""}<br>“${esc(label(src))}” will be noted in its Source, then deleted.`;};

function renderAnalyze(){

  const counts={};state.quotations.forEach(q=>q.codeIds.forEach(id=>counts[id]=(counts[id]||0)+1));

      return `<tr><td class="rowh"><span class="swatch" style="vertical-align:-1px;margin-right:6px;background:${f.c.color}"></span>${esc(f.c.name)}</td>${cells}<td><b>${sum}</b></td></tr>`;}).join("");

  const cooc=computeCooccurrence();
  const coocHtml=cooc.length?cooc.slice(0,14).map(p=>`<div class="cooc-row"><div class="cooc-pair"><span class="chip"><span class="dot" style="background:${p.a.color}"></span>${esc(p.a.name)}</span><span class="muted">+</span><span class="chip"><span class="dot" style="background:${p.b.color}"></span>${esc(p.b.name)}</span></div><span class="cooc-n">${p.n}</span></div>`).join(""):`<div class="hollow">No co-occurring codes yet. Apply two codes to the same or overlapping passages to see relationships.</div>`;
  let coderCards="";
  if(coders.length){
    const crow=coders.map(u=>{const qs=state.quotations.filter(q=>q.by===u);return `<tr><td class="rowh">${whoHTML(u)}</td><td>${qs.length}</td><td>${qs.reduce((a,q)=>a+q.codeIds.length,0)}</td><td>${new Set(qs.map(q=>q.docId)).size}</td></tr>`;}).join("");
    const cxHead=`<tr><th class="rowh">Code</th>${coders.map(u=>`<th>${esc(personName(u))}</th>`).join("")}</tr>`;
    const cxRows=freq.map(f=>`<tr><td class="rowh"><span class="swatch" style="vertical-align:-1px;margin-right:6px;background:${f.c.color}"></span>${esc(f.c.name)}</td>${coders.map(u=>{const n=state.quotations.filter(q=>q.by===u&&q.codeIds.includes(f.c.id)).length;return `<td class="${n?"":"v0"}">${n||"·"}</td>`;}).join("")}</tr>`).join("");
    coderCards=`<div class="card"><h3>Coders</h3><p class="ch-sub">Who coded what. Each quotation records the person who made it.</p><div class="matrix-scroll"><table class="matrix"><thead><tr><th class="rowh">Coder</th><th>Quotations</th><th>Code applications</th><th>Documents</th></tr></thead><tbody>${crow}</tbody></table></div></div>
      <div class="card"><h3>Code use by coder</h3><p class="ch-sub">How often each coder applied each code. Big gaps in a row often point to a code definition worth discussing.</p><div class="matrix-scroll"><table class="matrix"><thead>${cxHead}</thead><tbody>${cxRows}</tbody></table></div></div>`+agreementCard(coders);

      <div class="stat"><div class="n">${state.quotations.length}</div><div class="l">Quotations</div></div><div class="stat"><div class="n">${apps}</div><div class="l">Code applications</div></div>

function shorten(s,n){return s.length>n?s.slice(0,n-1)+"…":s}
function computeCooccurrence(){
  const pairs={};const add=(a,b)=>{if(a===b)return;const k=[a,b].sort().join("|");pairs[k]=(pairs[k]||0)+1;};
  state.quotations.forEach(q=>{for(let i=0;i<q.codeIds.length;i++)for(let j=i+1;j<q.codeIds.length;j++)add(q.codeIds[i],q.codeIds[j]);});
  const byDoc={};state.quotations.forEach(q=>{(byDoc[q.docId]=byDoc[q.docId]||[]).push(q);});
  Object.values(byDoc).forEach(qs=>{for(let i=0;i<qs.length;i++)for(let j=i+1;j<qs.length;j++){const a=qs[i],b=qs[j];if(a.start<b.end&&b.start<a.end)a.codeIds.forEach(x=>b.codeIds.forEach(y=>add(x,y)));}});
  return Object.entries(pairs).map(([k,n])=>{const[ai,bi]=k.split("|");const a=codeById(ai),b=codeById(bi);return a&&b?{a,b,n}:null;}).filter(Boolean).sort((x,y)=>y.n-x.n);
}
function mergeIv(iv){iv.sort((a,b)=>a[0]-b[0]);const o=[];for(const[s,e]of iv){if(o.length&&s<=o[o.length-1][1])o[o.length-1][1]=Math.max(o[o.length-1][1],e);else o.push([s,e]);}return o}
function ivLen(iv){return iv.reduce((a,[s,e])=>a+e-s,0)}
function ivInter(A,B){let i=0,j=0,t=0;while(i<A.length&&j<B.length){const s=Math.max(A[i][0],B[j][0]),e=Math.min(A[i][1],B[j][1]);if(e>s)t+=e-s;if(A[i][1]<B[j][1])i++;else j++;}return t}
function spans(coder,codeId,docs){const m={};state.quotations.forEach(q=>{if(q.by===coder&&q.codeIds.includes(codeId)&&docs.has(q.docId))(m[q.docId]=m[q.docId]||[]).push([q.start,q.end]);});for(const k in m)m[k]=mergeIv(m[k]);return m}
function agreementCard(coders){
  if(coders.length<2)return `<div class="card"><h3>Coder agreement</h3><p class="ch-sub" style="margin:0">Appears once at least two people have coded the same document.</p></div>`;
  const docsOf=u=>new Set(state.quotations.filter(q=>q.by===u).map(q=>q.docId));
  const pairs=[];for(let i=0;i<coders.length;i++)for(let j=i+1;j<coders.length;j++){const a=coders[i],b=coders[j];const da=docsOf(a),dbb=docsOf(b);const sh=new Set([...da].filter(x=>dbb.has(x)));if(sh.size)pairs.push({a,b,shared:sh});}
  if(!pairs.length)return `<div class="card"><h3>Coder agreement</h3><p class="ch-sub" style="margin:0">No two coders have worked on the same document yet. Assign the same transcript to two people to compare.</p></div>`;
  const cell=v=>v==null?`<td class="v0">—</td>`:`<td class="${v>=.7?"ag-hi":v>=.4?"ag-mid":"ag-lo"}">${Math.round(v*100)}%</td>`;
  const sums=pairs.map(()=>({s:0,n:0}));
  const rows=state.codes.map(c=>{const vals=pairs.map((p,k)=>{const A=spans(p.a,c.id,p.shared),B=spans(p.b,c.id,p.shared);let I=0,U=0;
      p.shared.forEach(d=>{const x=ivInter(A[d]||[],B[d]||[]);I+=x;U+=ivLen(A[d]||[])+ivLen(B[d]||[])-x;});const v=U?I/U:null;if(v!=null){sums[k].s+=v;sums[k].n++;}return v;});
    if(vals.every(v=>v==null))return"";return `<tr><td class="rowh"><span class="swatch" style="vertical-align:-1px;margin-right:6px;background:${c.color}"></span>${esc(c.name)}</td>${vals.map(cell).join("")}</tr>`;}).join("");
  const head=`<tr><th class="rowh">Code</th>${pairs.map(p=>`<th>${esc(personName(p.a))} ↔ ${esc(personName(p.b))}</th>`).join("")}</tr>`;
  const total=`<tr class="total"><td class="rowh">Average</td>${sums.map(s=>cell(s.n?s.s/s.n:null)).join("")}</tr>`;
  return `<div class="card"><h3>Coder agreement</h3><p class="ch-sub">Share of text that both coders marked with the same code, out of the text either of them marked with it (character overlap), counted only on documents both people coded. Use it as a quick consistency check before a calibration discussion. It is not Cohen's kappa.</p>
    <div class="matrix-scroll"><table class="matrix"><thead>${head}</thead><tbody>${rows||`<tr><td colspan="${pairs.length+1}" class="v0">No code used by both coders yet.</td></tr>`}${rows?total:""}</tbody></table></div></div>`;
}

      <button class="btn ghost sm" id="m_del" style="color:var(--danger)">Delete memo</button></div></div>`;
  const t=$("m_title"),b=$("m_body");
  const onType=()=>{memoDraft={id:m.id,title:t.value,content:b.value};const it=list.querySelector(`[data-m="${m.id}"] .mt`);if(it)it.textContent=t.value||"Untitled";clearTimeout(memoTimer);memoTimer=setTimeout(flushMemo,800);};
  t.addEventListener("input",onType);b.addEventListener("input",onType);t.addEventListener("blur",flushMemo);b.addEventListener("blur",flushMemo);
  $("m_del").onclick=()=>confirmModal("Delete memo?",`“${esc(m.title||"Untitled")}” will be deleted${mode==="shared"?" for everyone":""}.`,"Delete",()=>{memoDraft=null;clearTimeout(memoTimer);del("memos",m.id);ui.memoId=null;closeModal();toast("Memo deleted");});
}
$("addMemoBtn").onclick=()=>{if(!requireName())return;flushMemo();const now=Date.now();const m={id:uid("m"),title:"New memo",content:"",by:myBy(),at:now,updated:now};put("memos",m);ui.memoId=m.id;renderMemos();const t=$("m_title");if(t){t.focus();t.select();}};

/* ================= tabs ================= */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  if(ui.view==="memos")flushMemo();ui.view=t.getAttribute("data-view");
  document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",String(x===t)));
  ["code","analyze","memos"].forEach(v=>$("view-"+v).hidden=(v!==ui.view));closeCodePopup();renderAll();saveView();
});

/* ================= project menu ================= */
const projBtn=$("projBtn"),projMenu=$("projMenu");
function buildMenu(){
  const shared=mode==="shared";const it=[];
  it.push(`<button data-act="import">${shared?"Import into this project…":"Import project…"}<span class="k">.json</span></button>`);
  it.push(`<button data-act="export">Export project<span class="k">.json</span></button>`);
  it.push(`<button data-act="csv">Export quotations<span class="k">.csv</span></button>`);
  if(shared&&localMigratable())it.push(`<hr><button data-act="migrate">Move the project saved in this browser here</button>`);
  const extra=[];
  if(!shared||!state.documents.length)extra.push(`<button data-act="sample">${shared?"Add the example project":"Load the example project"}</button>`);
  if(!shared)extra.push(`<button data-act="clear" class="del">Clear everything…</button>`);
  if(extra.length)it.push("<hr>"+extra.join(""));
  projMenu.innerHTML=it.join("");
  projMenu.querySelectorAll("button").forEach(b=>b.onclick=()=>{projMenu.hidden=true;doProjAct(b.getAttribute("data-act"));});
}
projBtn.onclick=e=>{e.stopPropagation();if(projMenu.hidden)buildMenu();projMenu.hidden=!projMenu.hidden;};
document.addEventListener("click",e=>{if(!projMenu.contains(e.target)&&e.target!==projBtn)projMenu.hidden=true;});
function importInto(data){const by=myBy(),now=Date.now();
  (data.codes||[]).forEach((c,i)=>put("codes",{...c,by:c.by||by,at:c.at||now+i}));
  (data.documents||[]).forEach((d,i)=>put("documents",{...d,content:d.content||"",by:d.by||by,at:d.at||now+i}));
  (data.quotations||[]).forEach(q=>put("quotations",{...q,codeIds:q.codeIds||[],by:q.by||by,at:q.at||now}));
  (data.memos||[]).forEach((m,i)=>put("memos",{...m,by:m.by||by,at:m.at||m.updated||now+i}));}
function writesDrained(){return new Promise(res=>{const chk=()=>{if(!pendingW.size&&!syncing)res();else setTimeout(chk,400);};chk();});}
async function bulkImport(data,label){
  if(mode!=="shared"){state={name:data.name||"Imported project",documents:data.documents||[],codes:data.codes||[],quotations:data.quotations||[],memos:data.memos||[]};
    ui.currentDoc=null;ui.memoId=null;ui.codeFilter=null;saveLocal();renderAll();toast(label+" loaded");return;}
  if(!requireName())return;
  const n=(data.documents||[]).length+(data.codes||[]).length+(data.quotations||[]).length+(data.memos||[]).length;
  toast("Saving "+n+" items to the shared project…");importInto(data);
  if(!raw.meta.project&&data.name)setProjectName(data.name);
  await writesDrained();toast(label+" added to the shared project");
}
function doProjAct(a){
  if(a==="export"){const out={name:state.name,documents:state.documents,codes:state.codes,quotations:state.quotations,memos:state.memos,people:mode==="shared"?people:{},_app:"qualia-coder",_v:2};downloadText(JSON.stringify(out,null,2),safeName(state.name||"project")+".json");}
  if(a==="csv")exportCSV();
  if(a==="import")$("projInput").click();
  if(a==="migrate"){const s=loadLocal();if(!s)return;confirmModal("Move this browser's project into the shared project?",`${s.documents.length} document(s), ${s.codes.length} code(s) and ${s.quotations.length} quotation(s) will be added and attributed to you. Your browser copy stays as it is.`,"Move",()=>{closeModal();bulkImport(s,"Your project");},false);}
  if(a==="sample"){if(mode==="shared"){if(requireName())bulkImport(sampleProject(),"Example project");}
    else confirmModal("Load the example project?","This replaces the project saved in this browser. Export it first if you want to keep it.","Load example",()=>{closeModal();bulkImport(sampleProject(),"Example project");});}
  if(a==="clear")confirmModal("Clear everything?","All documents, codes, quotations and memos saved in this browser will be deleted. This cannot be undone.","Clear all",()=>{state=emptyProject();ui.currentDoc=null;ui.memoId=null;ui.codeFilter=null;saveLocal();closeModal();renderAll();toast("Cleared");});
}
$("projInput").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{let data;try{data=JSON.parse(r.result);if(!Array.isArray(data.documents)||!Array.isArray(data.codes))throw 0;}catch(err){toast("That file isn't a Qualia project (.json)");return;}
    if(mode==="shared"){if(data.people&&typeof data.people==="object")Object.entries(data.people).forEach(([id,p])=>{if(p&&p.name&&!raw.people[id])queueWrite("people/"+id,{name:p.name,at:Date.now()});});
      confirmModal("Import into the shared project?",`${data.documents.length} document(s), ${data.codes.length} code(s) and ${(data.quotations||[]).length} quotation(s) will be added. Items with the same ID as existing ones are overwritten.`,"Import",()=>{closeModal();bulkImport(data,"Import");},false);}
    else confirmModal("Import project?","This replaces the project saved in this browser.","Import",()=>{closeModal();bulkImport(data,"Project");},false);};
  r.readAsText(f);e.target.value="";};
function safeName(s){return s.replace(/[\\/:*?"<>|]+/g,"-").slice(0,80)||"project"}
function exportCSV(){
  const head=["Document","Codes","Quote","Comment","Start","End"];if(mode==="shared")head.splice(2,0,"Coder");const rows=[head];
  state.quotations.forEach(q=>{const d=docById(q.docId);const r=[d?d.name:"",q.codeIds.map(id=>{const c=codeById(id);return c?c.name:"";}).filter(Boolean).join("; "),qText(q),q.comment||"",q.start,q.end];
    if(mode==="shared")r.splice(2,0,q.by?rawName(q.by):"");rows.push(r);});
  downloadText("﻿"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n"),safeName(state.name||"quotations")+" - quotations.csv");
}
function downloadText(content,filename){
  try{const blob=new Blob([content],{type:"application/octet-stream"});const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=filename;a.target="_self";document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},400);toast("Downloading "+filename);
  }catch(e){showCopyModal(content,filename);}
}
function showCopyModal(content,filename){
  openModal(`<h2>Copy your export</h2><p class="sub">This browser blocked the download. Copy the text below and save it as <b>${esc(filename)}</b>.</p>
    <textarea class="copybox" id="cp_box" readonly>${esc(content)}</textarea><div class="modal-actions"><button class="btn" data-close>Close</button><button class="btn primary" id="cp_go">Copy</button></div>`);
  $("cp_go").onclick=()=>{const t=$("cp_box");t.select();const ok=()=>toast("Copied");
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(content).then(ok,()=>{try{document.execCommand("copy");ok();}catch(e){toast("Press Ctrl/⌘+C to copy");}});
    else{try{document.execCommand("copy");ok();}catch(e){toast("Press Ctrl/⌘+C to copy");}}};
}
$("projName").addEventListener("change",e=>setProjectName(e.target.value.trim()||"Untitled project"));

/* ================= explainer ================= */
$("statusPill").onclick=()=>{
  if(mode==="shared"){
    openModal(`<h2>Coding together</h2><p class="sub">${status==="live"?"Connected. Changes save automatically and reach the others within a few seconds.":status==="locked"?"Enter the project passcode to connect.":"Trying to reach the project. Your changes are kept and sent once it connects."}</p>
      <ul><li>Everyone who opens this link works in the same project: the same documents, codebook and memos.</li>
        <li>The data is stored in the project owner's Google Sheet.</li>
        <li>Each quotation records who coded it. You can change only your own; the codebook is shared, so anyone can edit codes.</li>
        <li>Use <b>Coder</b> above the text to see one person's coding, and <b>Analyze → Coder agreement</b> to compare two coders on the same document.</li></ul>
      <p class="sub" style="margin-top:12px">You're coding as <b>${esc(me.name||"(no name yet)")}</b> on this device.</p>
      <div class="modal-actions"><button class="btn left" id="x_name">Change my name</button><button class="btn primary" data-close>Got it</button></div>`);
    $("x_name").onclick=()=>askName(false);
  }else{
    openModal(`<h2>Saved in this browser only</h2><p class="sub">This copy isn't connected to the shared project.</p>
      <ul><li>Your project is stored in this browser on this device.</li><li>To code together, open the shared web app link from the project owner.</li><li>Use <b>Project → Export</b> regularly to keep a backup file.</li></ul>
      <div class="modal-actions"><button class="btn primary" data-close>Got it</button></div>`);
  }
};

/* ================= theme ================= */
$("themeBtn").onclick=()=>{const cur=document.documentElement.getAttribute("data-theme");const dark=cur?cur==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const next=dark?"light":"dark";document.documentElement.setAttribute("data-theme",next);lsSet(KEY+"_theme",next);};
$("addDocBtn").onclick=addDocModal;

/* ================= modal & toast ================= */
function openModal(html,opts){const r=$("modalRoot");ui.modalLocked=!!(opts&&opts.locked);
  r.innerHTML=`<div class="overlay"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  r.querySelector(".overlay").addEventListener("mousedown",e=>{if(e.target.classList.contains("overlay"))closeModal();});
  r.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>closeModal());
  const first=r.querySelector("input:not([readonly]),textarea:not([readonly])");if(first)setTimeout(()=>first.focus(),30);}
function closeModal(force){if(ui.modalLocked&&!force)return;ui.modalLocked=false;$("modalRoot").innerHTML="";}
function confirmModal(title,msg,label,onYes,danger=true){
  openModal(`<h2>${title}</h2><p class="sub" style="margin-bottom:20px">${msg}</p><div class="modal-actions"><button class="btn" data-close>Cancel</button><button class="btn ${danger?"danger":"primary"}" id="cfm">${label}</button></div>`);
  $("cfm").onclick=()=>onYes();}
let toastT;function toast(msg,action){const t=$("toast");t.textContent=msg;t.classList.toggle("act",!!action);
  if(action){const b=document.createElement("button");b.className="tact";b.textContent=action.label;b.onclick=()=>{t.classList.remove("show");action.fn();};t.appendChild(b);}
  t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),action?5000:2400);}

/* ================= boot ================= */
function startLocal(){mode="local";status="local";const s=loadLocal();
  state=s?{name:s.name||"Untitled project",documents:s.documents||[],codes:s.codes||[],quotations:(s.quotations||[]).map(q=>({...q,codeIds:q.codeIds||[]})),memos:s.memos||[]}:sampleProject();
  if(!s)saveLocal();renderAll();}
function boot(){
  const t=lsGet(KEY+"_theme");if(t)document.documentElement.setAttribute("data-theme",t);
  const sv=readView();if(["code","analyze","memos"].includes(sv.view))setView(sv.view);
  if(sv.doc)ui.wantDoc=sv.doc;if(sv.memo)ui.memoId=sv.memo;
  let st;$("viewerScroll").addEventListener("scroll",()=>{clearTimeout(st);st=setTimeout(saveScroll,250);},{passive:true});
  if(!SHARED){startLocal();return;}
  mode="shared";state=emptyProject();state.name="Shared project";loadMe();if(me.id&&me.name)people[me.id]={name:me.name};
  setStatus("connecting");renderAll();syncNow();
}
boot();
</script>
</body>
